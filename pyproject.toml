[project]
name = "mlops-project"
version = "0.1.0"
description = "Churn classifier : pipeline scikit-learn suivi par MLflow, servi par FastAPI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
